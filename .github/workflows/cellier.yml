name: Cellier

on:
  push:
    paths: ["cellier/**", ".github/workflows/cellier.yml"]
  pull_request:
    paths: ["cellier/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cellier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cellier/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:sql
      - run: npm run build

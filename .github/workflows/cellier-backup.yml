name: Cellier — sauvegarde hebdomadaire

on:
  schedule:
    - cron: "23 3 * * 0"   # dimanche, 3 h 23 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration
        id: cfg
        env:
          DB: ${{ secrets.CELLIER_DB_URL }}
        run: |
          if [ -z "$DB" ]; then echo "CELLIER_DB_URL absent : sauvegarde ignorée"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - name: Dump chiffré
        if: steps.cfg.outputs.skip != '1'
        env:
          DB: ${{ secrets.CELLIER_DB_URL }}
          PASS: ${{ secrets.CELLIER_BACKUP_PASSPHRASE }}
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --format=custom -f cellier.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 -o cellier.dump.gpg cellier.dump
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip != '1'
        with:
          name: cellier-${{ github.run_id }}
          path: cellier.dump.gpg
          retention-days: 90
